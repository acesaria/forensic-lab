# infra/ansible/lab_baseline.yml
- name: Victim environment baseline
  hosts: all
  become: yes

  vars_files:
    - "vars/{{ ansible_distribution | lower }}.yml"

  tasks:
    - name: Wait for cloud-init to finish
      ansible.builtin.command: cloud-init status --wait
      changed_when: false

    - name: Install offline-scenario prerequisites (per-distro)
      ansible.builtin.apt:
        name: "{{ baseline_present_pkgs }}"
        state: present
        update_cache: yes
      when: baseline_present_pkgs | length > 0

    - name: Ensure SSH service is running for orchestration
      ansible.builtin.service:
        name: ssh
        state: started
        enabled: yes
