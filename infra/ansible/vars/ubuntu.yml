# infra/ansible/vars/ubuntu.yml

isf_base_packages:
  - git
  - golang-go


# Packages baked into the lab baseline so offline scenarios can run their
# compile/setup steps without network access (lab VM is on the isolated net).
baseline_present_pkgs:
  - gcc
  - make
  - libpam0g-dev
  - libgcrypt20-dev
