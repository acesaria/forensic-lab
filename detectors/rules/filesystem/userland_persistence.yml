id: flab.filesystem.userland_persistence
name: Userland persistence via cron or systemd unit path
description: Flags disk-observed cron entries, systemd service/unit files, and user service paths after baseline filtering.
source_types: [disk]
artifact_classes: [file, service_unit_file]
attck: [T1053.003, T1543.002, T1543.003]
parameters:
  prefixes:
    - /etc/cron
    - /etc/systemd/
    - /usr/lib/systemd/
    - /lib/systemd/
    - /.config/systemd/user/
    - /home/
  suffixes: [.service, .timer, .socket, .path, .mount]
