scenario_id: userland_father_ldpreload
name: Father system-wide LD_PRELOAD calibration
objective: Generate a bounded calibration case using the pinned Father shared object and real /etc/ld.so.preload persistence.

attck:
  - T1574.006

safety:
  - disposable isolated thesis VM only
  - VM snapshot restoration is the primary cleanup mechanism
  - VM-backed SSH execution is mandatory; local execution is refused
  - no external network after build prerequisites
  - no evasion or cleanup variant behavior

paths:
  root: /tmp/forensic-lab/father_ldpreload
  source_dir: "{root}/source"
  recovery_dir: "{root}/recovery"
  upstream_archive_path: "{source_dir}/father-upstream-4eb2712.tar"
  father_lock_path: "{source_dir}/father.lock.yml"
  activation_helper_path: "{source_dir}/activate_system_preload.py"
  father_source_tree: "{source_dir}/Father-4eb2712caf612a7dc55fd4f34ff5c72b74c7c332"
  father_config_path: "{father_source_tree}/src/config.h"
  father_built_library_path: "{father_source_tree}/rk.so"
  installed_library_path: /usr/local/lib/forensic-lab/father/selinux.so.3
  preload_config_path: /etc/ld.so.preload
  preload_backup_path: "{recovery_dir}/ld.so.preload.before"
  preload_absent_marker_path: "{recovery_dir}/ld.so.preload.was_absent"

variables:
  preload_hide_token: father_calibration_nohide
  process_duration_seconds: 1800

capabilities:
  system_wide_ld_preload: true
  controlled_process_mapping: true
  failure_only_recovery: true
  cleanup: false

steps:
  - id: prepare_father_source
    type: python
    function: prepare_father_source
    intent: Stage the pinned Father archive, lock, and activation helper inside the guest.

  - id: configure_father
    type: python
    function: configure_father
    intent: Configure only the extracted guest copy with the documented installation path.

  - id: build_father_rootkit
    type: python
    function: build_father_rootkit
    intent: Build the pinned Father rk.so inside the guest.

  - id: install_activate_and_validate
    type: python
    function: install_activate_and_validate
    intent: Preflight the installed library, atomically activate /etc/ld.so.preload, and validate multiple mapped processes.

evidence_sources:
  - disk/filesystem
  - memory
  - timeline

postconditions:
  - /etc/ld.so.preload names the installed Father shared object
  - the shared object and preload configuration remain present for acquisition
  - three controlled dynamically linked processes remain alive with the shared object mapped
  - the manifest contains only concise operational execution facts
  - automatic detection and forensic conclusions remain out of scope

prerequisites:
  father_build:
    tools:
      - name: gcc
        check: command -v gcc >/dev/null 2>&1
        ubuntu_package: gcc
      - name: make
        check: command -v make >/dev/null 2>&1
        ubuntu_package: make
    headers:
      - name: security/pam_appl.h
        check: test -f /usr/include/security/pam_appl.h
        ubuntu_package: libpam0g-dev
      - name: gcrypt.h
        check: test -f /usr/include/gcrypt.h
        ubuntu_package: libgcrypt20-dev
    libraries:
      - name: libgcrypt
        check: ldconfig -p | grep -q 'libgcrypt\.so'
        ubuntu_package: libgcrypt20
