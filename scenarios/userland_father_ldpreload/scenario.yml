scenario_id: userland_father_ldpreload

parameters:
  root: /tmp/forensic-lab/father_ldpreload
  archive_path: "{root}/source/father-upstream-4eb2712.tar"
  script_path: "{root}/run_scenario.sh"
  installed_library_path: /usr/local/lib/forensic-lab/father/selinux.so.3
  preload_config_path: /etc/ld.so.preload
  process_duration_seconds: 1800

steps:
  - id: verify_father_source
    type: python
    function: verify_father_source

  - id: upload_father_source
    type: upload
    src: files/father-upstream-4eb2712.tar
    dest: "{archive_path}"

  - id: upload_guest_script
    type: upload
    src: files/run_scenario.sh
    dest: "{script_path}"

  - id: run_guest_script
    type: terminal
    command: >-
      bash {script_path} {root} {installed_library_path}
      {preload_config_path} {process_duration_seconds}
    timeout: 180

  - id: validate_father_backdoor
    type: python
    function: run_father_calibration
