scenario_id: userland_father_ldpreload
name: Father LD_PRELOAD DFIR
objective: Generate post-mortem evidence for controlled Father LD_PRELOAD activation and an accept-hook shell/session.

attck:
  - T1574.006
  - T1014
  - T1059.004

safety:
  - localhost-only accept-hook shell/session
  - no reverse shell or external network
  - no privilege escalation
  - no system-wide LD_PRELOAD persistence
  - no cleanup/evasion in the default scenario

paths:
  root: /tmp/forensic-lab/father_ldpreload
  source_dir: "{root}/source"
  config_dir: "{root}/config"
  lib_dir: "{root}/lib"
  run_dir: "{root}/run"
  observed_dir: "{root}/observed_files"

variables:
  archive_name: father-upstream-4eb2712.tar
  lock_name: father.lock.yml
  source_tree_name: Father-4eb2712caf612a7dc55fd4f34ff5c72b74c7c332
  listener_name: father_accept_listener.py
  library_name: selinux.so.3
  preload_artifact_name: ld.so.preload
  prefix: lobster
  env_var: lobster
  password: lobster
  gid: 1337
  hidden_port_hex: D431
  listen_host: 127.0.0.1
  listen_port: 2222
  source_port: 54321
  process_duration_seconds: 600

capabilities:
  ld_preload: true
  accept_hook_shell: true
  prefix_hiding_observation: true
  cleanup: false

steps:
  - id: prepare_father_source
    type: python
    function: prepare_father_source
    capability: provenance
    intent: Copy the pinned Father archive, source lock, and scenario wrapper.

  - id: configure_father
    type: python
    function: configure_father
    capability: configuration
    intent: Extract Father into the run workspace and configure only that temporary copy.

  - id: build_father_rootkit
    type: python
    function: build_father_rootkit
    capability: ld_preload
    intent: Compile Father's real rk.so from the configured run-local source tree.

  - id: install_preload_rootkit
    type: python
    function: install_preload_rootkit
    capability: ld_preload
    intent: Write the scenario-local preload artifact and record LD_PRELOAD activation.

  - id: trigger_accept_hook_capability
    type: python
    function: trigger_accept_hook_capability
    capability: accept_hook_shell
    intent: Trigger a bounded localhost-only accept-hook shell/session.

  - id: observe_file_hiding_effect
    type: python
    function: observe_file_hiding_effect
    capability: prefix_hiding_observation
    intent: Observe prefix-based hiding while preserving disk-visible evidence.

  - id: record_postconditions
    type: python
    function: record_postconditions
    capability: provenance
    intent: Record hashes, PIDs, paths, observations, and summary state.

evidence_sources:
  - disk/filesystem
  - memory
  - timeline
  - baseline comparison

postconditions:
  - installed shared object and scenario-local preload artifact are present
  - mapped shared object is expected in the hooked listener process
  - accept-hook shell/session is bounded and localhost-only
  - prefix-matching file remains disk-visible for post-mortem reconstruction
  - cleanup/evasion is a future variant only

expected_observables_file: expected_observables.yml

prerequisites:
  father_build:
    tools:
      - name: gcc
        check: command -v gcc >/dev/null 2>&1
        ubuntu_package: gcc
      - name: make
        check: command -v make >/dev/null 2>&1
        ubuntu_package: make
    headers:
      - name: security/pam_appl.h
        check: test -f /usr/include/security/pam_appl.h
        ubuntu_package: libpam0g-dev
      - name: gcrypt.h
        check: test -f /usr/include/gcrypt.h
        ubuntu_package: libgcrypt20-dev
    libraries:
      - name: libgcrypt
        check: ldconfig -p | grep -q 'libgcrypt\.so'
        ubuntu_package: libgcrypt20
