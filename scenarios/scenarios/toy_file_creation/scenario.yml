scenario_id: toy_file_creation
description: Innocuous demo scenario that creates and verifies one text file.
parameters:
  toy_name: toy.txt
steps:
  - id: create_toy_file
    type: shell
    command: "mkdir -p {work_dir} && printf 'forensic lab toy artifact\n' > {work_dir}/{toy_name}"
  - id: verify_toy_file
    type: python
    function: verify_toy_file
