# Custom gap-filler rule (Phase 3.4). Behavioral only: NO instance constants.
# The preload-config path is the T1574.006 mechanism itself (intrinsic to the
# technique), not a per-run secret, so matching it is not a circularity leak.
title: Userland Persistence Via ld.so.preload
id: lnx_ld_preload
status: experimental
description: A write or sudo command touching the dynamic-linker preload config.
references:
  - https://attack.mitre.org/techniques/T1574/006/
rationale: >
  /etc/ld.so.preload is the documented LD_PRELOAD persistence mechanism. The
  payload .so path is randomized per seed and never appears here; only the
  mechanism path, which is fixed by the OS, is referenced.
event_class: persistence_installed
logsource:
  product: linux
  service: auth
detection:
  selection:
    CommandLine|contains:
      - 'ld.so.preload'
  condition: selection
tags:
  - attack.persistence
  - attack.t1574.006
