# Custom gap-filler rule (Phase 3.4). Behavioral only: NO instance constants.
# Flags execution of a binary living under a world-writable temp directory, a
# class-level pattern that holds across random seeds.
title: Execution From World-Writable Temp Directory
id: lnx_tmp_exec
status: experimental
description: A process whose image path is under /tmp, /var/tmp or /dev/shm.
references:
  - https://attack.mitre.org/techniques/T1059/004/
rationale: >
  Temp directories are world-writable and not a normal home for executables;
  attackers stage payloads there. The path class is intrinsic to the behavior,
  not to any one scenario instance.
event_class: process_exec
logsource:
  product: linux
  category: process_creation
detection:
  selection_tmp:
    Image|startswith:
      - '/tmp/'
      - '/var/tmp/'
      - '/dev/shm/'
  selection_cmd:
    CommandLine|re:
      - '(^|\s)/tmp/'
      - '(^|\s)/var/tmp/'
      - '(^|\s)/dev/shm/'
  condition: selection_tmp or selection_cmd
tags:
  - attack.execution
  - attack.t1059.004
